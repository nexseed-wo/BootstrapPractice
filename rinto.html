<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap TODO</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .todo-card { max-width: 720px; margin: 2.5rem auto; }
    .task-label.completed { text-decoration: line-through; opacity: .6; }
    .task-actions button { margin-left: .25rem; }
  </style>
</head>
<body>
  <main class="container">
    <div class="card todo-card shadow-sm">
      <div class="card-body">
        <div class="d-flex align-items-center mb-3">
          <h3 class="mb-0">TODO リスト</h3>
          <small class="text-muted ms-2">（Bootstrap で作成）</small>
          <div class="ms-auto">
            <button id="clearCompleted" class="btn btn-outline-danger btn-sm" title="完了済みをすべて削除">
              <i class="bi bi-trash"></i> 完了済みを削除
            </button>
          </div>
        </div>

        <!-- 入力フォーム -->
        <form id="taskForm" class="mb-3">
          <div class="input-group">
            <input id="taskInput" type="text" class="form-control" placeholder="タスクを追加...（Enter で追加）」 aria-label="タスク">
            <button class="btn btn-primary" type="submit">追加</button>
          </div>
        </form>

        <!-- フィルター -->
        <ul class="nav nav-pills mb-3" id="filterTabs" role="tablist">
          <li class="nav-item" role="presentation"><button class="nav-link active" data-filter="all">すべて</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-filter="active">未完了</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-filter="completed">完了</button></li>
        </ul>

        <!-- タスクリスト -->
        <ul id="taskList" class="list-group"></ul>

        <div class="mt-3 small text-muted" id="taskCount">0 件</div>
      </div>
    </div>
  </main>

  <!-- 編集モーダル -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">タスクを編集</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input id="editInput" type="text" class="form-control">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
          <button id="saveEdit" type="button" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (Popper を含む) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // シンプルな TODO UI のフロントエンドロジック（ローカルストレージに保存）
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');
    const filterTabs = document.getElementById('filterTabs');
    const clearCompletedBtn = document.getElementById('clearCompleted');

    const editModalEl = document.getElementById('editModal');
    const editModal = new bootstrap.Modal(editModalEl);
    const editInput = document.getElementById('editInput');
    const saveEditBtn = document.getElementById('saveEdit');

    let tasks = JSON.parse(localStorage.getItem('bs_todo_tasks') || '[]');
    let currentFilter = 'all';
    let editingId = null;

    function saveTasks() {
      localStorage.setItem('bs_todo_tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      taskList.innerHTML = '';
      const filtered = tasks.filter(t => {
        if (currentFilter === 'active') return !t.done;
        if (currentFilter === 'completed') return t.done;
        return true;
      });

      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex align-items-center';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'form-check-input me-2';
        checkbox.checked = !!task.done;
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const label = document.createElement('div');
        label.className = 'task-label flex-grow-1';
        if (task.done) label.classList.add('completed');
        label.textContent = task.text;

        const actions = document.createElement('div');
        actions.className = 'task-actions btn-group';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm btn-outline-secondary';
        editBtn.innerHTML = '<i class="bi bi-pencil"></i>';
        editBtn.title = '編集';
        editBtn.addEventListener('click', () => {
          editingId = task.id;
          editInput.value = task.text;
          editModal.show();
        });

        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-sm btn-outline-danger';
        delBtn.innerHTML = '<i class="bi bi-trash"></i>';
        delBtn.title = '削除';
        delBtn.addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveTasks();
          renderTasks();
        });

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        li.appendChild(checkbox);
        li.appendChild(label);
        li.appendChild(actions);

        taskList.appendChild(li);
      });

      taskCount.textContent = `${tasks.length} 件（表示: ${filtered.length} 件）`;
    }

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.push({ id: Date.now().toString(), text, done: false });
      taskInput.value = '';
      saveTasks();
      renderTasks();
    });

    filterTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      [...filterTabs.querySelectorAll('.nav-link')].forEach(n => n.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTasks();
    });

    clearCompletedBtn.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.done);
      saveTasks();
      renderTasks();
    });

    saveEditBtn.addEventListener('click', () => {
      const text = editInput.value.trim();
      if (!text) return;
      const t = tasks.find(x => x.id === editingId);
      if (t) t.text = text;
      saveTasks();
      editModal.hide();
      renderTasks();
    });

    // 初期描画
    renderTasks();
  </script>
</body>
</html>

</body>
</html>
